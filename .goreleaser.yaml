version: 2

before:
  hooks:
    - sh -c "cd frontend && npm ci && npm run build"
    - sh -c "rm -rf backend/internal/webui/dist && mkdir -p backend/internal/webui/dist && cp -r frontend/dist/. backend/internal/webui/dist/"
    - sh -c "cd backend && go mod tidy"

builds:
  - id: wt-panel
    dir: backend
    main: ./cmd/server
    binary: wt-panel
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: wt-panel
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}
    files:
      - README.md
      - install.sh

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: "Features"
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: "Fixes"
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: "Performance"
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: "Other"
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^build:'
      - Merge pull request
      - Merge branch

release:
  footer: |
    ## Verifying

    ```sh
    sha256sum -c checksums.txt --ignore-missing
    ```

    ## Установка/обновление

    ```sh
    curl -fsSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPOSITORY }}/main/install.sh -o install.sh
    sudo bash install.sh
    ```

    `install.sh` сам скачивает нужный бинарник из этого релиза (linux/amd64
    или linux/arm64) — исходники клонировать не нужно.
