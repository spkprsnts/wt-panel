name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: >-
          Force this version bump regardless of commit messages since the
          last tag (e.g. if a release-worthy change was committed with the
          wrong Conventional Commits prefix). Leave as "auto" for the normal
          commit-message-based detection.
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify backend (gofmt, vet, test, build)
        working-directory: backend
        run: |
          fmt=$(gofmt -l .)
          if [ -n "$fmt" ]; then
            echo "gofmt needed on:"
            echo "$fmt"
            exit 1
          fi
          go vet ./...
          go test ./...
          go build ./...

      - name: Verify frontend (lint, typecheck, build)
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Install svu
        run: go install github.com/caarlos0/svu/v3@latest

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          current=$(svu current)
          case "$BUMP" in
            patch|minor|major) next=$(svu "$BUMP") ;;
            *)                 next=$(svu next) ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$next" ]; then
            echo "No release-worthy commits since $current — skipping release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing $current -> $next"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.next }}" -m "Release ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.version.outputs.next }}"

      - name: GoReleaser
        if: steps.version.outputs.release == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
